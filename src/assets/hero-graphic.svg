<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="none"/>
  <!-- Abstract shapes -->
  <rect x="100" y="100" width="200" height="150" rx="10" fill="url(#grad1)" stroke="#00ff88" stroke-width="2"/>
  <rect x="350" y="80" width="180" height="200" rx="10" fill="url(#grad1)" stroke="#00ff88" stroke-width="2"/>
  <rect x="580" y="150" width="160" height="120" rx="10" fill="url(#grad1)" stroke="#00ff88" stroke-width="2"/>
  <!-- Code symbols -->
  <text x="150" y="180" font-family="monospace" font-size="24" fill="#00ff88" opacity="0.6">&lt;/&gt;</text>
  <text x="400" y="160" font-family="monospace" font-size="24" fill="#00ff88" opacity="0.6">{ }</text>
  <text x="620" y="210" font-family="monospace" font-size="24" fill="#00ff88" opacity="0.6">⚡</text>
  <!-- Decorative dots -->
  <circle cx="200" cy="350" r="8" fill="#00ff88" opacity="0.4"/>
  <circle cx="500" cy="400" r="6" fill="#00ff88" opacity="0.3"/>
  <circle cx="680" cy="350" r="10" fill="#00ff88" opacity="0.2"/>
  <circle cx="300" cy="450" r="5" fill="#00ff88" opacity="0.5"/>
  <circle cx="550" cy="480" r="7" fill="#00ff88" opacity="0.3"/>
</svg>
